<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pandawa Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        .app {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            margin: 5vh auto;
            background: white;
            display: flex;
            flex-direction: column;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        /* HEADER */

        .header {
            background: #075e54;
            color: white;
            padding: 18px 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 13px;
            opacity: 0.8;
        }

        /* CHAT */

        .chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #efeae2;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            margin-bottom: 12px;
            border-radius: 10px;
            line-height: 1.4;
            font-size: 14px;
        }

        .bot {
            background: white;
            margin-right: auto;
        }

        .user {
            background: #d9fdd3;
            margin-left: auto;
        }

        /* INPUT */

        .input-area {
            display: flex;
            padding: 12px;
            background: #f0f2f5;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        .input-area button {
            width: 50px;
            border: none;
            border-radius: 50%;
            background: #075e54;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .input-area button:hover {
            background: #064e46;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">
        <h2>🤖 Pandawa Chatbot</h2>
        <p>Asisten virtual</p>
    </div>


    <!-- CHAT -->

    <div class="chat" id="chat">

        <div class="message bot">
            Halo 👋<br>
            Saya Pandawa Chatbot.
            <br><br>
            Ada yang bisa saya bantu?
        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Ketik pesan..."
            onkeydown="handleKey(event)"
        >

        <button onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>


<script>

async function sendMessage() {

    const input = document.getElementById("messageInput");

    const message = input.value.trim();

    if (message === "") {
        return;
    }

    // Tampilkan pesan pengguna
    addMessage(message, "user");

    // Kosongkan input
    input.value = "";

    try {

const response = await fetch(
    "https://pandawa-api.fikrymuhammad91.workers.dev",
    {
        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            message: message
        })
    }
);

const data = await response.json();

        addMessage(data.reply, "bot");

    } catch (error) {

        addMessage(
            "Maaf, backend sedang tidak dapat dihubungi.",
            "bot"
        );

        console.error(error);
    }
}


function addMessage(text, type) {

    const chat = document.getElementById("chat");

    const message = document.createElement("div");

    message.className = "message " + type;

    message.innerHTML = text;

    chat.appendChild(message);

    // scroll ke pesan terbaru

    chat.scrollTop = chat.scrollHeight;

}


function handleKey(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

}

</script>

</body>
</html>
