<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pandawa Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #222;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🤖 Pandawa Chatbot</h1>

        <p>
            Selamat datang di aplikasi chatbot saya.
        </p>

        <button onclick="sapa()">
            Klik Saya
        </button>

    </div>

    <script>
        function sapa() {
            alert("Halo! Aplikasi Pandawa berhasil berjalan 🚀");
        }
    </script>

</body>
</html>
