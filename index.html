<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pandawa Chatbot</title>

    <!-- MARKDOWN RENDERER -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- HTML SANITIZER -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f0f2f5;

        }


        .app {

            width: 100%;

            max-width: 700px;

            height: 90vh;

            margin: 5vh auto;

            background: white;

            display: flex;

            flex-direction: column;

            border-radius: 15px;

            overflow: hidden;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.15);

        }


        /* =========================
           HEADER
        ========================= */

        .header {

            background: #075e54;

            color: white;

            padding: 18px 20px;

        }


        .header h2 {

            margin: 0;

            font-size: 20px;

        }


        .header p {

            margin: 5px 0 0;

            font-size: 13px;

            opacity: 0.8;

        }


        /* =========================
           CHAT
        ========================= */

        .chat {

            flex: 1;

            padding: 20px;

            overflow-y: auto;

            background: #efeae2;

        }


        .message {

            max-width: 75%;

            padding: 10px 14px;

            margin-bottom: 12px;

            border-radius: 10px;

            line-height: 1.5;

            font-size: 14px;

            word-wrap: break-word;

        }


        .bot {

            background: white;

            margin-right: auto;

        }


        .user {

            background: #d9fdd3;

            margin-left: auto;

        }


        /* =========================
           MARKDOWN
        ========================= */

        .message p {

            margin-top: 0;

            margin-bottom: 8px;

        }


        .message p:last-child {

            margin-bottom: 0;

        }


        .message strong {

            font-weight: 700;

        }


        .message em {

            font-style: italic;

        }


        .message ul,
        .message ol {

            margin-top: 6px;

            margin-bottom: 8px;

            padding-left: 22px;

        }


        .message li {

            margin-bottom: 4px;

        }


        .message h1,
        .message h2,
        .message h3 {

            margin-top: 10px;

            margin-bottom: 6px;

        }


        .message code {

            background: #f1f1f1;

            padding: 2px 5px;

            border-radius: 4px;

            font-family: monospace;

        }


        .message pre {

            background: #f5f5f5;

            padding: 10px;

            border-radius: 8px;

            overflow-x: auto;

        }


        .message pre code {

            background: none;

            padding: 0;

        }


        .message table {

            border-collapse: collapse;

            width: 100%;

            margin-top: 8px;

            margin-bottom: 8px;

            font-size: 13px;

        }


        .message th,
        .message td {

            border: 1px solid #ddd;

            padding: 6px 8px;

            text-align: left;

        }


        .message th {

            background: #f5f5f5;

        }


        /* =========================
           INPUT CONTAINER
        ========================= */

        .input-wrapper {

            position: relative;

            background: #f0f2f5;

        }


        /* =========================
           SUGGESTION POPUP
        ========================= */

        .suggestions {

            position: absolute;

            bottom: 100%;

            left: 12px;

            right: 72px;

            background: white;

            border-radius: 12px 12px 0 0;

            box-shadow:
                0 -4px 15px rgba(0,0,0,0.12);

            overflow: hidden;

            display: none;

            z-index: 1000;

            max-height: 250px;

            overflow-y: auto;

        }


        .suggestions-title {

            padding: 10px 14px;

            font-size: 12px;

            color: #777;

            border-bottom: 1px solid #eee;

            background: #fafafa;

        }


        .suggestion-item {

            padding: 12px 14px;

            cursor: pointer;

            border-bottom: 1px solid #eee;

            transition: background 0.15s;

        }


        .suggestion-item:hover {

            background: #f0f2f5;

        }


        .suggestion-question {

            font-size: 14px;

            color: #222;

            line-height: 1.4;

        }


        .suggestion-category {

            font-size: 11px;

            color: #777;

            margin-top: 4px;

        }


        /* =========================
           INPUT
        ========================= */

        .input-area {

            display: flex;

            padding: 12px;

            background: #f0f2f5;

            gap: 10px;

        }


        .input-area input {

            flex: 1;

            padding: 12px 15px;

            border: none;

            border-radius: 25px;

            outline: none;

            font-size: 14px;

        }


        .input-area button {

            width: 50px;

            height: 50px;

            border: none;

            border-radius: 50%;

            background: #075e54;

            color: white;

            font-size: 18px;

            cursor: pointer;

        }


        .input-area button:hover {

            background: #064e46;

        }


        .input-area button:disabled {

            background: #999;

            cursor: not-allowed;

        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            font-style: italic;

            color: #777;

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h2>
            🤖 Pandawa Chatbot
        </h2>

        <p>
            Asisten virtual
        </p>

    </div>


    <!-- =========================
         CHAT
    ========================= -->

    <div
        class="chat"
        id="chat"
    >

        <div class="message bot">

            Halo 👋<br>

            Saya Pandawa Chatbot.

            <br><br>

            Ada yang bisa saya bantu?

        </div>

    </div>


    <!-- =========================
         INPUT WRAPPER
    ========================= -->

    <div
        class="input-wrapper"
        id="inputWrapper"
    >


        <!-- =========================
             SUGGESTIONS
        ========================= -->

        <div
            class="suggestions"
            id="suggestions"
        >

            <div class="suggestions-title">

                💡 Mungkin maksud Anda?

            </div>

            <div
                id="suggestionList"
            ></div>

        </div>


        <!-- =========================
             INPUT AREA
        ========================= -->

        <div class="input-area">


            <input
                type="text"
                id="messageInput"
                placeholder="Ketik pesan..."
                autocomplete="off"
            >


            <button
                id="sendButton"
                onclick="sendMessage()"
            >

                ➤

            </button>


        </div>


    </div>


</div>



<script>


/* =====================================================
   KONFIGURASI
===================================================== */


const WORKER_URL =
    "https://pandawa-api.fikrymuhammad91.workers.dev";


const DATABASE_URL =
    "https://script.google.com/macros/s/AKfycbxPoXb71CgihQqetwelFe0O8UxRilyOeWkGP2dIzFt4dfZNwkf0pWGVPVlRWcxKOvReGw/exec";


let suggestionTimer = null;


/* =====================================================
   ELEMENT
===================================================== */


const input =
    document.getElementById("messageInput");


const suggestions =
    document.getElementById("suggestions");


const suggestionList =
    document.getElementById("suggestionList");


const sendButton =
    document.getElementById("sendButton");


/* =====================================================
   EVENT INPUT
===================================================== */


input.addEventListener(
    "input",
    function () {

        const query =
            input.value.trim();


        clearTimeout(
            suggestionTimer
        );


        // Jika terlalu pendek

        if (query.length < 3) {

            hideSuggestions();

            return;

        }


        // Tunggu sebentar
        // supaya tidak request setiap ketikan

        suggestionTimer =
            setTimeout(
                function () {

                    searchSuggestions(query);

                },
                350
            );

    }
);


/* =====================================================
   SEARCH SUGGESTIONS
===================================================== */


async function searchSuggestions(query) {

    try {

        const response =
            await fetch(
                DATABASE_URL +
                "?q=" +
                encodeURIComponent(query)
            );


        const result =
            await response.json();


        if (
            result.status !== "success"
            ||
            !Array.isArray(result.data)
            ||
            result.data.length === 0
        ) {

            hideSuggestions();

            return;

        }


        showSuggestions(
            result.data
        );


    } catch (error) {

        console.error(
            "Suggestion error:",
            error
        );

        hideSuggestions();

    }

}


/* =====================================================
   SHOW SUGGESTIONS
===================================================== */


function showSuggestions(data) {


    suggestionList.innerHTML = "";


    // Maksimal 5 suggestion

    const suggestionsData =
        data.slice(0, 5);


    suggestionsData.forEach(
        function (item) {


            const element =
                document.createElement("div");


            element.className =
                "suggestion-item";


            element.innerHTML = `

                <div class="suggestion-question">

                    🔎

                    ${escapeHtml(
                        item.pertanyaan
                    )}

                </div>

                ${
                    item.kategori
                    ?
                    `

                    <div class="suggestion-category">

                        ${escapeHtml(
                            item.kategori
                        )}

                    </div>

                    `
                    :
                    ""
                }

            `;


            element.addEventListener(
                "click",
                function () {

                    selectSuggestion(
                        item
                    );

                }
            );


            suggestionList.appendChild(
                element
            );

        }
    );


    suggestions.style.display =
        "block";

}


/* =====================================================
   SELECT SUGGESTION
===================================================== */


async function selectSuggestion(item) {


    hideSuggestions();


    // Tampilkan pertanyaan yang dipilih

    addMessage(
        item.pertanyaan,
        "user"
    );


    // Tampilkan loading

    const loading =
        addMessage(
            "Sedang mengambil jawaban...",
            "bot loading"
        );


    try {


        /*
         * Kita mengambil jawaban berdasarkan ID.
         *
         * TIDAK memanggil Cloudflare Worker.
         *
         * TIDAK memanggil OpenAI.
         */

        const response =
            await fetch(
                DATABASE_URL +
                "?id=" +
                encodeURIComponent(
                    item.id
                )
            );


        const result =
            await response.json();


        loading.remove();


        if (
            result.status !== "success"
            ||
            !result.data
        ) {

            addMessage(
                "Maaf, jawaban tersebut tidak ditemukan.",
                "bot"
            );

            return;

        }


        addMessage(
            result.data.jawaban,
            "bot"
        );


    } catch (error) {


        console.error(
            "Answer error:",
            error
        );


        loading.remove();


        addMessage(
            "Maaf, jawaban tidak dapat diambil.",
            "bot"
        );

    }

}


/* =====================================================
   SEND MESSAGE
===================================================== */


async function sendMessage() {


    const message =
        input.value.trim();


    if (message === "") {

        return;

    }


    // Tutup suggestion

    hideSuggestions();


    // Tampilkan pesan user

    addMessage(
        message,
        "user"
    );


    // Kosongkan input

    input.value = "";


    // Disable tombol

    sendButton.disabled =
        true;


    // Loading

    const loading =
        addMessage(
            "Pandawa sedang berpikir...",
            "bot loading"
        );


    try {


        const response =
            await fetch(
                WORKER_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message

                        })

                }
            );


        const data =
            await response.json();


        loading.remove();


        if (
            data.status !== "success"
        ) {

            addMessage(
                data.reply ||
                "Terjadi kesalahan.",
                "bot"
            );

            return;

        }


        addMessage(
            data.reply,
            "bot"
        );


    } catch (error) {


        console.error(
            error
        );


        loading.remove();


        addMessage(
            "Maaf, backend sedang tidak dapat dihubungi.",
            "bot"
        );


    } finally {


        sendButton.disabled =
            false;

    }

}


/* =====================================================
   ADD MESSAGE
===================================================== */


function addMessage(
    text,
    type
) {


    const chat =
        document.getElementById(
            "chat"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " + type;


    /*
     * Render Markdown dari AI.
     *
     * marked = mengubah Markdown menjadi HTML.
     *
     * DOMPurify = membersihkan HTML berbahaya
     * sebelum dimasukkan ke halaman.
     */

    try {

        const rendered =
            marked.parse(
                String(text)
            );


        message.innerHTML =
            DOMPurify.sanitize(
                rendered
            );

    } catch (error) {

        /*
         * Fallback jika Markdown renderer
         * mengalami masalah.
         */

        console.error(
            "Markdown render error:",
            error
        );


        message.textContent =
            text;

    }


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;


    return message;

}


/* =====================================================
   HIDE SUGGESTIONS
===================================================== */


function hideSuggestions() {

    suggestions.style.display =
        "none";

    suggestionList.innerHTML =
        "";

}


/* =====================================================
   ESCAPE HTML
===================================================== */


function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================================
   ENTER
===================================================== */


input.addEventListener(
    "keydown",
    function (event) {


        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   CLICK DI LUAR INPUT
===================================================== */


document.addEventListener(
    "click",
    function (event) {


        const wrapper =
            document.getElementById(
                "inputWrapper"
            );


        if (
            !wrapper.contains(
                event.target
            )
        ) {

            hideSuggestions();

        }

    }
);


</script>


</body>

</html>
